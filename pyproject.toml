[tool.poetry]
name = "hsync-common"
version = "1.0.0"
description = "HSYNC Common - shared models, constants, and compression utilities"
authors = ["Alberto Basso"]
license = "MPL-2.0"
readme = "README.md"
packages = [{include = "hsync_common"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
zstandard = "^0.25.0"
loguru = "^0.7.3"
python-dotenv = "^1.2.1"
cryptography = "^48.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
