[project]
name = "hsync-common"
version = "1.2.0-beta.1"
description = "HSYNC Common - shared models, constants, and compression utilities"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = [
    "hsync",
    "synchronization",
    "delta-transfer",
    "peer-to-peer",
    "protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "loguru>=0.7.3,<0.9.0",
    "pathspec>=1.1.1,<2.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.urls]
Homepage = "https://github.com/albertsdk/hsync-common"
Repository = "https://github.com/albertsdk/hsync-common"
Issues = "https://github.com/albertsdk/hsync-common/issues"
Documentation = "https://github.com/albertsdk/hsync-common/blob/main/docs/README.md"

[tool.poetry]
packages = [{include = "hsync_common"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "0.17.6"
pre-commit = "^4.6.2"
pytest-cov = "^7.1.0"
mypy = "^2.3.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_common.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_common.*",
    "default::Warning:tests.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Curated best-practice set: the pycodestyle/pyflakes core plus the rule
# families that catch real defects and dead code without the opinionated noise
# (see ``ignore``). ``RUF`` enforces noqa / ``__all__`` / ``__slots__`` hygiene,
# ``ARG``/``RET``/``PIE``/``PERF``/``FURB`` the mechanical cleanups, ``N``/``A``
# naming and builtin shadowing, ``ISC``/``PGH``/``G``/``LOG`` misc.
select = [
    "E", "F", "W",       # pycodestyle, pyflakes, warnings
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B", "A", "C4",      # bugbear, builtin shadowing, comprehensions
    "ISC", "ICN",        # implicit string concat, import conventions
    "PIE", "RET", "RSE", # misc lints, return, raise
    "SIM", "TID",        # simplify, tidy-imports
    "ARG", "PERF",       # unused arguments, performance
    "FURB", "RUF",       # refurb, ruff-specific (noqa / __all__ hygiene)
    "PGH", "LOG", "G",   # pygrep-hooks, logging
    "PL", "T10", "ERA",  # pylint, debugger, commented-out code
    "C90",               # mccabe complexity (threshold below)
]
ignore = [
    # pre-existing
    "E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105",
    # deliberate patterns / opinionated rules
    "ARG002",                     # unused method args: interface/override conformance
    "EM101", "EM102", "TRY003",   # exception-message style (opinionated)
    "N818",                       # exception naming: public API already shipped
    "PLC0415",                    # import-outside-top-level: lazy imports are deliberate
    "PLW0603",                    # global-statement: module singletons are deliberate
    "PLR2004",                    # magic values: domain thresholds, noise > signal
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # function-shape metrics
    "PTH",                        # pathlib migration deliberately out of scope here
    "DTZ005",                     # datetime.now without tz (single, audited site)
    "ERA001",                     # commented-out code: false positives on doc examples
    "RUF002", "RUF003",           # ambiguous unicode: intentional math notation
]

[tool.ruff.lint.per-file-ignores]
# Shipped code keeps the strict rules; tests and benches favour readability: a
# fixture keeps otherwise-unused parameters, a tuple is unpacked to document its
# shape, and a test may assert on intentionally odd strings (e.g. fullwidth
# digits).
"tests/**" = ["ARG001", "ARG002", "ARG005", "RUF059", "RUF001"]
"bench/**" = ["ARG001", "ARG005", "RUF059", "RUF001"]

[tool.ruff.lint.mccabe]
# A pragmatic ceiling that the current code meets; lower it as functions are
# refactored.
max-complexity = 15

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
