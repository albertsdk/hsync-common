[project]
name = "hsync-common"
version = "1.0.1"
description = "HSYNC Common - shared models, constants, and compression utilities"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = [
    "hsync",
    "synchronization",
    "delta-transfer",
    "peer-to-peer",
    "protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pathspec>=1.1.1,<2.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.urls]
Homepage = "https://github.com/albertsdk/hsync-common"
Repository = "https://github.com/albertsdk/hsync-common"
Issues = "https://github.com/albertsdk/hsync-common/issues"
Documentation = "https://github.com/albertsdk/hsync-common/blob/main/docs/README.md"

[tool.poetry]
packages = [{include = "hsync_common"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "0.16.10"
pre-commit = "^4.6.2"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_common.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_common.*",
    "default::Warning:tests.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
