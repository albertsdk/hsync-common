[project]
name = "hsync-common"
version = "1.0.0"
description = "HSYNC Common - shared models, constants, and compression utilities"
authors = [{name = "Alberto Basso", email = "17047798+albertobasso@users.noreply.github.com"}]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=48.0.1,<51.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pathspec>=1.0,<2.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "zstandard>=0.25.0,<0.26.0",
]

[tool.poetry]
packages = [{include = "hsync_common"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.16.6"
pre-commit = "^4.0.1"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_common.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_common.*",
    "default::Warning:tests.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
