# CI — hsync-common
# Lint + tests for the shared library. The pytest run also covers the contract
# drift checks (WS/LAN schemas, golden fixtures, pairing/election) that guard the
# protocol single-source-of-truth.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Gate the markdown docs (README, architecture, ADRs) on valid relative
      # links. Pure stdlib, so it runs before the heavier Poetry install.
      - name: Docs link-check
        run: python scripts/dev/check_doc_links.py

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format check)
        run: poetry run ruff format --check .

      - name: Tests
        run: poetry run pytest -q
