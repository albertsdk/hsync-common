# Release — hsync-common
# Build the sdist/wheel and publish them to PyPI. Two triggers:
#
# 1. vX.Y.Z tag pushed  →  build and publish to PyPI.
# 2. workflow_dispatch  →  build only, or publish to TestPyPI (dry run).
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in the
# repository. Before the first release, configure a pending publisher on PyPI
# (and TestPyPI) with:
#   owner: albertsdk, repository: hsync-common, workflow: release.yml,
#   environment: pypi  (TestPyPI: environment: testpypi)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (build-only produces artifacts only)"
        type: choice
        options: ["build-only", "testpypi", "pypi"]
        default: "build-only"

# Least privilege by default; the publish jobs grant id-token: write themselves.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A published version is immutable, so refuse a tag/version mismatch
      # before anything is uploaded.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag!r} does not match version {version!r}"
          print(f"tag {tag} matches version {version}")
          PY

      - name: Install Poetry
        run: pipx install poetry

      - name: Build sdist and wheel
        run: poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Independent of the PyPI publish, so a vX.Y.Z tag always produces a GitHub
  # Release with the sdist/wheel attached, mirroring the other HSYNC projects.
  release:
    name: create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ ! contains(github.ref_name, '-') }}
